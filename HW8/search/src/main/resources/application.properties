spring.application.name=search

# Tavily Search API
# The real key is NOT stored here. Put it in application-local.properties
# (same folder, git-ignored). See application-local.properties.example.
tavily.enabled=true
tavily.api-key=
tavily.max-results=10

# Don't hang the page if Tavily is slow
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s

# Load the git-ignored local overrides (holds the real API key) if present.
spring.config.import=optional:classpath:application-local.properties
